openapi: 3.0.3
info:
  title: Support Ticket Management System API
  description: |
    REST API for managing support tickets, comments, and user assignment.

    **Scope notes:**
    - Authentication is not implemented; `createdBy` is populated from the `X-User-Id` header or a development stub.
    - Ticket and comment deletion are not supported.
    - Status transitions are enforced server-side via a strict workflow matrix.
  version: 1.0.0
  contact:
    name: Support Ticket Management System

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Health
    description: Application and database connectivity
  - name: Users
    description: Read-only pre-seeded users
  - name: Tickets
    description: Ticket CRUD, search, filter, and status workflow
  - name: Comments
    description: Ticket comments

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns application readiness and database connectivity status.
      operationId: getHealth
      responses:
        "200":
          description: Application and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOkResponse"
              example:
                status: ok
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthErrorResponse"
              example:
                status: error
                error: Database connection unavailable

  /users:
    get:
      tags: [Users]
      summary: List users
      description: Returns all pre-seeded users for assignee selection. Read-only.
      operationId: listUsers
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  name: Alice Johnson
                  email: alice@example.com
                  role: agent
                - id: "22222222-2222-2222-2222-222222222222"
                  name: Bob Smith
                  email: bob@example.com
                  role: admin
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets
      description: |
        Returns tickets with optional keyword search and status filter.
        Filters are combined with AND logic. No matches returns an empty array.
      operationId: listTickets
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: List of ticket summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketSummary"
              examples:
                withResults:
                  summary: Tickets found
                  value:
                    - id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                      title: Cannot log in to dashboard
                      priority: High
                      status: Open
                      assignedTo: null
                      createdAt: "2026-07-23T09:00:00.000Z"
                      updatedAt: "2026-07-23T09:00:00.000Z"
                    - id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
                      title: Printer offline
                      priority: Low
                      status: In Progress
                      assignedTo:
                        id: "22222222-2222-2222-2222-222222222222"
                        name: Bob Smith
                      createdAt: "2026-07-22T14:30:00.000Z"
                      updatedAt: "2026-07-23T08:45:00.000Z"
                noResults:
                  summary: No matches
                  value: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Tickets]
      summary: Create ticket
      description: |
        Creates a new support ticket. Server always sets `status` to `Open` and ignores
        any client-provided status. `createdBy` is taken from `X-User-Id`.
      operationId: createTicket
      parameters:
        - $ref: "#/components/parameters/XUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
            examples:
              minimal:
                summary: Required fields only
                value:
                  title: Cannot log in to dashboard
                  description: User reports 401 error after password reset.
                  priority: High
              withAssignee:
                summary: With optional assignee
                value:
                  title: Printer offline
                  description: Floor 3 printer not responding.
                  priority: Low
                  assignedTo: "22222222-2222-2222-2222-222222222222"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
              example:
                id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                title: Cannot log in to dashboard
                description: User reports 401 error after password reset.
                priority: High
                status: Open
                assignedTo: null
                createdBy:
                  id: "11111111-1111-1111-1111-111111111111"
                  name: Alice Johnson
                createdAt: "2026-07-23T09:00:00.000Z"
                updatedAt: "2026-07-23T09:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Get ticket detail
      description: Returns full ticket information including comments ordered by `createdAt` ascending.
      operationId: getTicketById
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket detail with comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
              example:
                id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                title: Cannot log in to dashboard
                description: User reports 401 error after password reset.
                priority: High
                status: In Progress
                assignedTo:
                  id: "22222222-2222-2222-2222-222222222222"
                  name: Bob Smith
                createdBy:
                  id: "11111111-1111-1111-1111-111111111111"
                  name: Alice Johnson
                createdAt: "2026-07-23T09:00:00.000Z"
                updatedAt: "2026-07-23T10:15:00.000Z"
                comments:
                  - id: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                    message: Reset link was expired. Sent a new one.
                    createdBy:
                      id: "22222222-2222-2222-2222-222222222222"
                      name: Bob Smith
                    createdAt: "2026-07-23T09:30:00.000Z"
                    updatedAt: "2026-07-23T09:30:00.000Z"
                  - id: "dddddddd-dddd-dddd-dddd-dddddddddddd"
                    message: User confirmed login works now.
                    createdBy:
                      id: "11111111-1111-1111-1111-111111111111"
                      name: Alice Johnson
                    createdAt: "2026-07-23T10:00:00.000Z"
                    updatedAt: "2026-07-23T10:00:00.000Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags: [Tickets]
      summary: Update ticket
      description: |
        Partially updates ticket fields and/or status. At least one field is required.

        **Status workflow (authoritative):**
        - `Open` → `In Progress`, `Cancelled`
        - `In Progress` → `Resolved`, `Cancelled`
        - `Resolved` → `Closed`
        - `Closed` and `Cancelled` are terminal — status changes are rejected, but field updates are allowed.
      operationId: updateTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketRequest"
            examples:
              updateTitle:
                summary: Update title and priority
                value:
                  title: Cannot log in to dashboard (updated)
                  priority: Critical
              assign:
                summary: Assign ticket
                value:
                  assignedTo: "22222222-2222-2222-2222-222222222222"
              unassign:
                summary: Unassign ticket
                value:
                  assignedTo: null
              statusTransition:
                summary: Valid status transition
                value:
                  status: In Progress
      responses:
        "200":
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
              example:
                id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                title: Cannot log in to dashboard
                description: User reports 401 error after password reset.
                priority: High
                status: In Progress
                assignedTo: null
                createdBy:
                  id: "11111111-1111-1111-1111-111111111111"
                  name: Alice Johnson
                createdAt: "2026-07-23T09:00:00.000Z"
                updatedAt: "2026-07-23T10:15:00.000Z"
        "400":
          description: Validation failure or invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidTransition:
                  summary: Invalid status transition
                  value:
                    error: Cannot transition from Open to Closed
                invalidAssignee:
                  summary: Invalid assignee
                  value:
                    error: Validation failed
                    details:
                      - field: assignedTo
                        message: Invalid assignee
                emptyBody:
                  summary: Empty update body
                  value:
                    error: Validation failed
                    details:
                      - field: body
                        message: At least one field must be provided
                terminalStatus:
                  summary: Status change on terminal ticket
                  value:
                    error: Status change not allowed for Closed tickets
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tickets/{id}/comments:
    post:
      tags: [Comments]
      summary: Add comment
      description: |
        Adds a comment to an existing ticket. `createdBy` is taken from `X-User-Id`.
        `updatedAt` is set equal to `createdAt` on insert. Comments are immutable.
      operationId: addComment
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/XUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
            example:
              message: Escalated to tier-2 support.
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
              example:
                id: "eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee"
                message: Escalated to tier-2 support.
                createdBy:
                  id: "22222222-2222-2222-2222-222222222222"
                  name: Bob Smith
                createdAt: "2026-07-23T11:00:00.000Z"
                updatedAt: "2026-07-23T11:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      description: Ticket UUID
      schema:
        type: string
        format: uuid
      example: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"

    XUserId:
      name: X-User-Id
      in: header
      required: false
      description: UUID of the acting user for `createdBy` fields. Falls back to a development stub if omitted.
      schema:
        type: string
        format: uuid
      example: "11111111-1111-1111-1111-111111111111"

    SearchQuery:
      name: search
      in: query
      required: false
      description: Case-insensitive keyword match on title or description. Empty or omitted applies no text filter.
      schema:
        type: string
      example: login

    StatusQuery:
      name: status
      in: query
      required: false
      description: Filter by exact ticket status.
      schema:
        $ref: "#/components/schemas/TicketStatus"
      example: Open

  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Validation failed
            details:
              - field: title
                message: title is required

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Ticket not found

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Internal server error

  schemas:
    Priority:
      type: string
      enum: [Low, Medium, High, Critical]
      example: High

    TicketStatus:
      type: string
      enum: [Open, In Progress, Resolved, Closed, Cancelled]
      example: Open

    UserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1

    UserSummary:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          minLength: 1

    TicketSummary:
      type: object
      required: [id, title, priority, status, assignedTo, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 255
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/TicketStatus"
        assignedTo:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Ticket:
      type: object
      required:
        - id
        - title
        - description
        - priority
        - status
        - assignedTo
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 10000
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/TicketStatus"
        assignedTo:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        createdBy:
          $ref: "#/components/schemas/UserRef"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [comments]
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/Comment"

    Comment:
      type: object
      required: [id, message, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
          maxLength: 5000
        createdBy:
          $ref: "#/components/schemas/UserRef"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTicketRequest:
      type: object
      required: [title, description, priority]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Required. Non-empty after trim.
        description:
          type: string
          minLength: 1
          maxLength: 10000
          description: Required. Non-empty after trim.
        priority:
          $ref: "#/components/schemas/Priority"
        assignedTo:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Optional. Must reference an existing user or be null.

    UpdateTicketRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: If provided, must be non-empty after trim.
        description:
          type: string
          minLength: 1
          maxLength: 10000
          description: If provided, must be non-empty after trim.
        priority:
          $ref: "#/components/schemas/Priority"
        assignedTo:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Valid user UUID or null to unassign.
        status:
          $ref: "#/components/schemas/TicketStatus"
          description: Must be a valid transition from the ticket's current status.

    CreateCommentRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 5000
          description: Required. Non-empty after trim.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error summary.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
          description: Field name associated with the error, when applicable.
        message:
          type: string

    HealthOkResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    HealthErrorResponse:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
          enum: [error]
        error:
          type: string
